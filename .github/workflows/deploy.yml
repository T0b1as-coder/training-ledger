name: Deploy to GitHub Pages

# Publishes the site (index.html at the repo root) to GitHub Pages on every
# push to main. One-time setup: Settings -> Pages -> Build and deployment ->
# Source -> "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: read the repo, write a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root. It's just index.html plus docs; nothing to build.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
